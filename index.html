<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Blockly Arduino Nano</title>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/msg/es.js"></script>
  <style>
    #blocklyDiv { height: 480px; width: 100%; }
    #codeArea { width: 100%; height: 200px; font-family: monospace; }
  </style>
</head>
<body>
  <h2>Programa tu Arduino Nano con Bloques</h2>
  
  <div id="blocklyDiv"></div>
  <xml id="toolbox" style="display: none">
    <category name="Lógica" colour="210">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
    </category>
    <category name="Bucles" colour="120">
      <block type="controls_repeat_ext"></block>
      <block type="controls_whileUntil"></block>
    </category>
    <category name="Arduino" colour="0">
      <block type="arduino_setup_loop"></block>
      <block type="arduino_digital_write"></block>
      <block type="arduino_delay"></block>
    </category>
  </xml>
  
  <button onclick="generarCodigo()">Generar Código Arduino</button>
  <textarea id="codeArea" readonly></textarea>

  <script>
    // Inicializar Blockly
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      trashcan: true,
      zoom: { controls: true }
    });

    // Definir bloques personalizados para Arduino
    Blockly.Blocks['arduino_setup_loop'] = {
      init: function() {
        this.appendDummyInput().appendField("Arduino Nano");
        this.appendStatementInput("SETUP").setCheck(null).appendField("setup");
        this.appendStatementInput("LOOP").setCheck(null).appendField("loop");
        this.setColour(0);
        this.setTooltip("Estructura básica de Arduino");
      }
    };

    Blockly.Blocks['arduino_digital_write'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("DigitalWrite pin")
            .appendField(new Blockly.FieldNumber(13, 0, 19), "PIN")
            .appendField(new Blockly.FieldDropdown([["HIGH","HIGH"],["LOW","LOW"]]), "STATE");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(0);
      }
    };

    Blockly.Blocks['arduino_delay'] = {
      init: function() {
        this.appendDummyInput()
            .appendField("delay")
            .appendField(new Blockly.FieldNumber(1000, 0), "MS")
            .appendField("ms");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setColour(0);
      }
    };

    // Generadores de código (CRÍTICO: sin esto no genera código)
    Blockly.Arduino = new Blockly.Generator('Arduino');

    Blockly.Arduino['arduino_setup_loop'] = function(block) {
      var setupCode = Blockly.Arduino.statementToCode(block, 'SETUP');
      var loopCode = Blockly.Arduino.statementToCode(block, 'LOOP');
      return 'void setup() {\n' + setupCode + '}\n\nvoid loop() {\n' + loopCode + '}\n';
    };

    Blockly.Arduino['arduino_digital_write'] = function(block) {
      var pin = block.getFieldValue('PIN');
      var state = block.getFieldValue('STATE');
      return 'digitalWrite(' + pin + ', ' + state + ');\n';
    };

    Blockly.Arduino['arduino_delay'] = function(block) {
      var ms = block.getFieldValue('MS');
      return 'delay(' + ms + ');\n';
    };

    function generarCodigo() {
      var code = Blockly.Arduino.workspaceToCode(workspace);
      document.getElementById('codeArea').value = code;
    }
  </script>
</body>
</html>
