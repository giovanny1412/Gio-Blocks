<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloques para Arduino Nano</title>
    <!-- Cargar Blockly desde CDN -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 5px; }
        p { color: #666; margin-top: 0; }
        .container {
            display: flex;
            gap: 20px;
            height: 65vh;
        }
        #blocklyDiv {
            flex: 2;
            height: 100%;
            border: 1px solid #ccc;
            background-color: #fff;
        }
        #codeDiv {
            flex: 1;
            height: 100%;
            background-color: #1e1e1e;
            color: #dcdcdc;
            padding: 15px;
            font-family: monospace;
            white-space: pre-wrap;
            overflow-y: auto;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Generador de Bloques para Arduino Nano</h1>
    <p>Ensambla tus bloques en Setup o Loop, selecciona el pin y descarga tu archivo .ino</p>

    <div class="container">
        <div id="blocklyDiv"></div>
        <div id="codeDiv">// Conecta los bloques al Setup o Loop para ver el código...</div>
    </div>

    <div class="controls">
        <button onclick="downloadCode()">Descargar Archivo .ino</button>
    </div>

    <!-- Caja de herramientas -->
    <xml id="toolbox" style="display: none">
        <block type="arduino_setup"></block>
        <block type="arduino_loop"></block>
        <block type="pin_mode"></block>
        <block type="digital_write"></block>
        <block type="delay_ms"></block>
    </xml>

    <script>
        // 1. Definición de Bloques con selector de Pines (0 al 13)
        const pinesDisponibles = [
            ["D0", "0"], ["D1", "1"], ["D2", "2"], ["D3", "3"], 
            ["D4", "4"], ["D5", "5"], ["D6", "6"], ["D7", "7"], 
            ["D8", "8"], ["D9", "9"], ["D10", "10"], ["D11", "11"], 
            ["D12", "12"], ["D13", "13"]
        ];

        // Bloque SETUP
        Blockly.Blocks['arduino_setup'] = {
            init: function() {
                this.appendDummyInput().appendField("SETUP (Configuración inicial)");
                this.appendStatementInput("STACK").setCheck(null);
                this.setColour(210);
                this.setTooltip("Código que se ejecuta una sola vez al iniciar");
            }
        };

        // Bloque LOOP
        Blockly.Blocks['arduino_loop'] = {
            init: function() {
                this.appendDummyInput().appendField("LOOP (Bucle principal)");
                this.appendStatementInput("STACK").setCheck(null);
                this.setColour(160);
                this.setTooltip("Código que se repite indefinidamente");
            }
        };

        // Bloque pinMode
        Blockly.Blocks['pin_mode'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("Configurar Pin")
                    .appendField(new Blockly.FieldDropdown(pinesDisponibles), "PIN")
                    .appendField("como")
                    .appendField(new Blockly.FieldDropdown([["SALIDA (OUTPUT)", "OUTPUT"], ["ENTRADA (INPUT)", "INPUT"]]), "MODE");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(230);
            }
        };

        // Bloque digitalWrite
        Blockly.Blocks['digital_write'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("Escribir en Pin")
                    .appendField(new Blockly.FieldDropdown(pinesDisponibles), "PIN")
                    .appendField("estado")
                    .appendField(new Blockly.FieldDropdown([["HIGH (Alto / Encendido)", "HIGH"], ["LOW (Bajo / Apagado)", "LOW"]]), "STATE");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(230);
            }
        };

        // Bloque Delay
        Blockly.Blocks['delay_ms'] = {
            init: function() {
                this.appendDummyInput()
                    .appendField("Esperar (ms)")
                    .appendField(new Blockly.FieldNumber(1000, 0), "TIME");
                this.setPreviousStatement(true, null);
                this.setNextStatement(true, null);
                this.setColour(290);
            }
        };

        // 2. Generadores de Código C++
        Blockly.JavaScript['arduino_setup'] = function(block) {
            var branch = Blockly.JavaScript.statementToCode(block, 'STACK');
            return branch;
        };

        Blockly.JavaScript['arduino_loop'] = function(block) {
            var branch = Blockly.JavaScript.statementToCode(block, 'STACK');
            return branch;
        };

        Blockly.JavaScript['pin_mode'] = function(block) {
            var pin = block.getFieldValue('PIN');
            var mode = block.getFieldValue('MODE');
            return 'pinMode(' + pin + ', ' + mode + ');\n';
        };

        Blockly.JavaScript['digital_write'] = function(block) {
            var pin = block.getFieldValue('PIN');
            var state = block.getFieldValue('STATE');
            return 'digitalWrite(' + pin + ', ' + state + ');\n';
        };

        Blockly.JavaScript['delay_ms'] = function(block) {
            var time = block.getFieldValue('TIME');
            return 'delay(' + time + ');\n';
        };

        // 3. Inicializar espacio de trabajo
        var demoWorkspace = Blockly.inject('blocklyDiv', {
            toolbox: document.getElementById('toolbox'),
            trashcan: true
        });

        // 4. Actualizador de código en tiempo real
        function myUpdateCode(event) {
            let setupCode = "";
            let loopCode = "";

            // Buscar en los bloques principales del workspace
            var topBlocks = demoWorkspace.getTopBlocks(true);
            for (var i = 0; i < topBlocks.length; i++) {
                var block = topBlocks[i];
                if (block.type === 'arduino_setup') {
                    setupCode = Blockly.JavaScript.statementToCode(block, 'STACK');
                } else if (block.type === 'arduino_loop') {
                    loopCode = Blockly.JavaScript.statementToCode(block, 'STACK');
                }
            }

            var finalCode = `#include <Arduino.h>\n\n` +
                            `void setup() {\n` + setupCode + `}\n\n` +
                            `void loop() {\n` + loopCode + `}\n`;

            document.getElementById('codeDivinnerText').innerText = finalCode; // Fallback text container check
            document.getElementById('codeDiv').innerText = finalCode;
        }

        demoWorkspace.addChangeListener(myUpdateCode);

        // 5. Descargar archivo
        function downloadCode() {
            var codeText = document.getElementById('codeDiv').innerText;
            var element = document.createElement('a');
            var file = new Blob([codeText], {type: 'text/plain'});
            element.href = URL.createObjectURL(file);
            element.download = "arduino_nano_project.ino";
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }
    </script>
</body>
</html>
