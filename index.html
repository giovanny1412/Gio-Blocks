<style>
*{box-sizing:border-box;}
body{font-family:"Segoe UI",Arial,sans-serif;margin:0;padding:15px;background:#f0f2f5;}
h2{color:#333;margin-bottom:8px;font-size:22px;display:flex;align-items:center;gap:10px;}
.main-container{display:flex;gap:15px;}
.left-panel{flex:1;min-width:0;}
.right-panel{width:380px;display:flex;flex-direction:column;gap:10px;}
#blocklyDiv{height:460px;width:100%;border:2px solid #007acc;border-radius:8px;background:#fff;}
.top-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.top-bar button,.controls button,.serial-controls button{padding:8px 16px;font-size:14px;cursor:pointer;border:none;border-radius:5px;font-weight:bold;transition:all 0.2s;}
.top-bar button:hover,.controls button:hover,.serial-controls button:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,0.15);}
.btn-generar{background:#007acc;color:white;}
.btn-descargar{background:#6c757d;color:white;}
.btn-subir{background:#28a745;color:white;}
.btn-subir:disabled{background:#6c757d;cursor:not-allowed;transform:none;}
.btn-guardar{background:#fd7e14;color:white;}
.btn-cargar{background:#6f42c1;color:white;}
.btn-ejemplo{background:#17a2b8;color:white;}
.btn-serial-start{background:#28a745;color:white;}
.btn-serial-stop{background:#dc3545;color:white;}
.btn-serial-clear{background:#6c757d;color:white;}
#codeArea{width:100%;height:140px;font-family:"Fira Code","Courier New",monospace;font-size:12px;margin-top:10px;padding:10px;border:2px solid #ddd;border-radius:8px;background:#1e1e1e;color:#d4d4d4;resize:vertical;}
#statusArea{margin-top:8px;padding:8px 12px;border-radius:5px;font-size:13px;display:none;align-items:center;gap:6px;}
.status-ok{background:#d4edda;color:#155724;border:1px solid #c3e6cb;display:flex !important;}
.status-err{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;display:flex !important;}
.status-info{background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb;display:flex !important;}
.spinner{width:14px;height:14px;border:2px solid #ccc;border-top:2px solid #007acc;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.hint{color:#666;font-size:12px;margin-left:auto;}
input[type="file"]{display:none;}
.serial-panel{background:#1e1e1e;border:2px solid #333;border-radius:8px;display:flex;flex-direction:column;height:460px;}
.serial-header{background:#2d2d2d;padding:10px 14px;border-radius:6px 6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #444;}
.serial-header h3{color:#fff;margin:0;font-size:15px;flex:1;}
.serial-header select{padding:5px 8px;border-radius:4px;border:1px solid #555;background:#333;color:#fff;font-size:13px;}
.serial-header .serial-status{width:10px;height:10px;border-radius:50%;background:#dc3545;}
.serial-header .serial-status.active{background:#28a745;box-shadow:0 0 6px #28a745;}
#serialOutput{flex:1;padding:10px;font-family:"Fira Code","Courier New",monospace;font-size:13px;color:#d4d4d4;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
.serial-controls{padding:10px 14px;background:#2d2d2d;border-radius:0 0 6px 6px;border-top:1px solid #444;display:flex;gap:8px;}
.model-bar{display:flex;gap:10px;align-items:center;margin-bottom:8px;background:#fff;padding:8px 12px;border-radius:6px;border:1px solid #ddd;}
.model-bar label{font-weight:bold;color:#333;font-size:13px;}
.model-bar select{padding:5px 10px;border-radius:4px;border:1px solid #ccc;background:#fff;font-size:13px;}
.model-info{color:#666;font-size:12px;}

/* Indicador de conexion */
.conn-indicator{display:flex;align-items:center;gap:8px;font-size:13px;color:#333;background:#fff;padding:6px 12px;border-radius:6px;border:1px solid #ddd;margin-left:auto;}
.conn-dot{width:10px;height:10px;border-radius:50%;background:#dc3545;transition:background 0.3s;}
.conn-dot.connected{background:#28a745;box-shadow:0 0 6px #28a745;}
.conn-info{font-weight:600;}
.conn-port{color:#666;font-size:12px;}

/* Log de compilacion */
.compile-log-panel{background:#1e1e1e;border:2px solid #333;border-radius:8px;margin-top:10px;overflow:hidden;}
.compile-log-header{background:#2d2d2d;padding:8px 14px;border-bottom:1px solid #444;display:flex;justify-content:space-between;align-items:center;}
.compile-log-header h4{color:#fff;margin:0;font-size:13px;}
#compileLogArea{width:100%;height:160px;font-family:"Fira Code","Courier New",monospace;font-size:12px;padding:10px;background:#1e1e1e;color:#d4d4d4;border:none;resize:vertical;overflow-y:auto;}
#compileLogArea::-webkit-scrollbar{width:8px;}#compileLogArea::-webkit-scrollbar-thumb{background:#444;border-radius:4px;}
.btn-cancelar{background:#dc3545;color:white;}
.btn-cancelar:disabled{background:#6c757d;cursor:not-allowed;}

.btn-limpiar{background:#e74c3c;color:white;}
.btn-limpiar:hover{background:#c0392b;}
</style>

<div class="model-bar">

  <select id="espModel" onchange="cambiarModelo()">

    <option value="s3">ESP32-S3</option>
    <option value="c3">ESP32-C3</option>
    <option value="c6">ESP32-C6</option>

  <span class="model-info" id="modelInfo">WiFi + BT Classic + BLE | 34 GPIOs | 2x DAC (GPIO25,26)</span>
  <div class="conn-indicator" id="connIndicator">

    <span class="conn-info" id="connText">Buscando...</span>

  </div>
</div>
<div class="main-container">
<div class="left-panel">
<div class="top-bar">
<button class="btn-guardar" onclick="guardarProyecto()">Guardar</button>
<button class="btn-cargar" onclick="document.getElementById('fileInput').click()">Cargar</button>
<input type="file" id="fileInput" accept=".json" onchange="cargarProyecto(this)">
<button class="btn-ejemplo" onclick="cargarEjemplo('blink')">Blink</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('wifi_scan')">WiFi Scan</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('ble_server')">BLE Server</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('web_server')">Web Server</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('web_led')">LED Web</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('adc_dac')">ADC + DAC</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('bt_led')">LED Bluetooth</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('touch')">Touch</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('pwm_servo')">PWM Servo</button>
<button class="btn-ejemplo" onclick="cargarEjemplo('bmp280')">BMP280</button>

      <button class="btn-ejemplo" onclick="cargarEjemplo('now_master')">NOW Master</button>
      <button class="btn-ejemplo" onclick="cargarEjemplo('now_slave')">NOW Esclavo</button>
</div>
<div id="blocklyDiv"></div>
<div class="controls">
<button class="btn-generar" onclick="generarCodigo()">Generar Codigo</button>

<button class="btn-subir" id="btnSubir" onclick="subirAAduino()">Subir a ESP32</button>
<button class="btn-limpiar" onclick="limpiarEspacio()" title="Libera espacio de compilaciones y temporales">Limpiar Espacio</button>
<span class="hint">Conecta el ESP32 y ejecuta el agente</span>
</div>
<div id="statusArea"></div>
<div class="compile-log-panel" id="compileLogPanel" style="display:none;">
  <div class="compile-log-header">
    <h4>Log de Compilacion / Subida</h4>
    <button class="btn-cancelar" id="btnCancelar" onclick="cancelarSubida()" disabled>Cancelar</button>
  </div>
  <textarea id="compileLogArea" readonly></textarea>
</div>
<textarea id="codeArea" placeholder="El codigo ESP32 aparecera aqui..."></textarea>
</div>
<div class="right-panel">
<div class="serial-panel">
<div class="serial-header">
<h3>Monitor Serial</h3>
<div class="serial-status" id="serialStatus"></div>
<select id="serialBaud">
<option value="9600">9600 baud</option>
<option value="115200" selected>115200 baud</option>
<option value="57600">57600 baud</option>
<option value="4800">4800 baud</option>
</select>
</div>
<div id="serialOutput"></div>
<div class="serial-controls">
<button class="btn-serial-start" id="btnSerialStart" onclick="iniciarMonitor()">Iniciar</button>
<button class="btn-serial-stop" id="btnSerialStop" onclick="detenerMonitor()">Detener</button>
<button class="btn-serial-clear" onclick="limpiarMonitor()">Limpiar</button>
</div>
</div>
</div>

<script>
// ========== MODELOS ESP32 ==========
var MODELOS = {
  dev: {name:"ESP32 Dev Module", info:"WiFi + BT Classic + BLE | 34 GPIOs | 2x DAC (GPIO25,26)", hasDac:true, hasBtClassic:true},
  s3:  {name:"ESP32-S3", info:"WiFi + BLE 5.0 + USB OTG | 45 GPIOs | Sin DAC", hasDac:false, hasBtClassic:false},
  c3:  {name:"ESP32-C3", info:"WiFi + BLE 5.0 | 22 GPIOs | Sin DAC | RISC-V", hasDac:false, hasBtClassic:false},
  c6:  {name:"ESP32-C6", info:"WiFi 6 + BLE 5.0 + 802.15.4 | 30 GPIOs | Sin DAC | RISC-V", hasDac:false, hasBtClassic:false}
};

function cambiarModelo() {
  var m = document.getElementById("espModel").value;
  document.getElementById("modelInfo").textContent = MODELOS[m].info;
  showStatus("Modelo seleccionado: " + MODELOS[m].name, "info");
}

// ========== BLOQUES PERSONALIZADOS ==========
Blockly.Blocks["esp32_setup_loop"] = {
  init: function() {
    this.setColour("#007acc");
    this.appendDummyInput().appendField("ESP32");
    this.appendStatementInput("SETUP").setCheck(null).appendField("setup");
    this.appendStatementInput("LOOP").setCheck(null).appendField("loop");
    this.setTooltip("Bloque principal.");
    this.setDeletable(false);
  }
};

Blockly.Blocks["esp32_pin_mode"] = {
  init: function() {
    this.setColour("#007acc");
    this.appendDummyInput()
      .appendField("pinMode GPIO")
      .appendField(new Blockly.FieldNumber(2, 0, 48), "PIN")
      .appendField(new Blockly.FieldDropdown([["OUTPUT","OUTPUT"],["INPUT","INPUT"],["INPUT_PULLUP","INPUT_PULLUP"],["INPUT_PULLDOWN","INPUT_PULLDOWN"]]), "MODE");
    this.setPreviousStatement(true, null);
    this.setNextStatement(true, null);
  }
};

Blockly.Blocks["esp32_digital_write"] = {
  init: function() {
    this.setColour("#007acc");
    this.appendDummyInput()
      .appendField("digitalWrite GPIO")
      .appendField(new Blockly.FieldNumber(2, 0, 48), "PIN")
      .appendField(new Blockly.FieldDropdown([["HIGH","HIGH"],["LOW","LOW"]]), "STATE");
    this.setPreviousStatement(true, null);
    this.setNextStatement(true, null);
  }
};

Blockly.Blocks["esp32_digital_read"] = {
  init: function() {
    this.setColour("#007acc");
    this.appendDummyInput()
      .appendField("digitalRead GPIO")
      .appendField(new Blockly.FieldNumber(2, 0, 48), "PIN");
    this.setOutput(true, "Number");
  }
};

Blockly.Blocks["esp32_analog_read"] = {
  init: function() {
    this.setColour("#007acc");
    this.appendDummyInput()
      .appendField("analogRead GPIO")
      .appendField(new Blockly.FieldNumber(34, 0, 48), "PIN");
    this.setOutput(true, "Number");
    this.setTooltip("Lee el valor ADC (0-4095 en ESP32 Dev/S3, 0-1023 en C3/C6).");
  }
};

Blockly.Blocks["esp32_dac_write"] = {
  init: function() {
    this.setColour("#007acc");
    this.appendDummyInput()
      .appendField("dacWrite GPIO")
      .appendField(new Blockly.FieldDropdown([["25","25"],["26","26"]]), "PIN");
    this.appendValueInput("VALUE").setCheck("Number").appendField("valor 0-255");
    this.setPreviousStatement(true, null);
    this.setNextStatement(true, null);
    this.setInputsInline(true);
    this.setTooltip("Solo ESP32 Dev Module (GPIO25 y 26). S3/C3/C6 no tienen DAC.");
  }
};

Blockly.Blocks["esp32_pwm_write"] = {
  init: function() {
    this.setColour("#007acc");
    this.appendDummyInput()
      .appendField("ledcWrite GPIO")
      .appendField(new Blockly.FieldNumber(18, 0, 48), "PIN");
    this.appendValueInput("VALUE").setCheck("Number").appendField("valor 0-255");
    this.setPreviousStatement(true, null);
    this.setNextStatement(true, null);
    this.setInputsInline(true);
    this.setTooltip("Salida PWM usando ledc. Canal automatico.");
  }
};

Blockly.Blocks["esp32_ledc_attach"] = {
  init: function() {
    this.setColour("#007acc");
    this.appendDummyInput()
      .appendField("ledcAttach GPIO")
      .appendField(new Blockly.FieldNumber(18, 0, 48), "PIN")
      .appendField("frecuencia")
      .appendField(new Blockly.FieldNumber(5000, 1, 40000000), "FREQ")
      .appendField("resolucion bits")
      .appendField(new Blockly.FieldNumber(8, 1, 20), "RES");
    this.setPreviousStatement(true, null);
    this.setNextStatement(true, null);
    this.setInputsInline(true);
    this.setTooltip("Configura un pin como salida PWM. El canal LEDC se asigna automaticamente.");
  }

// ========== GENERADOR ESP32 ==========
try {
  if (!Blockly.Arduino) {
    Blockly.Arduino = new Blockly.Generator("Arduino");
  }
} catch(e) {
  console.error("Error creando generador:", e);
}

var Arduino = Blockly.Arduino;
Arduino.ORDER_ATOMIC = 0;
Arduino.ORDER_NONE = 99;

Arduino.init = function(workspace) {
  this.definitions_ = Object.create(null);
  this.functionNames_ = Object.create(null);
  this.setups_ = Object.create(null);
  this.nameDB_ = new Blockly.Names(this.RESERVED_WORDS_ || "");
  this.nameDB_.setVariableMap(workspace.getVariableMap());
  this.nameDB_.populateVariables(workspace);
  this.nameDB_.populateProcedures(workspace);
};

Arduino.finish = function(code) {
  var definitions = [];
  for (var name in this.definitions_) { definitions.push(this.definitions_[name]); }
  this.definitions_ = Object.create(null);
  this.functionNames_ = Object.create(null);
  if (this.nameDB_) this.nameDB_.reset();
  return definitions.join("\n") + "\n" + code;
};

Arduino.scrub_ = function(block, code, opt_thisOnly) {
  var nextBlock = block.nextConnection && block.nextConnection.targetBlock();
  var nextCode = opt_thisOnly ? "" : this.blockToCode(nextBlock);
  return code + nextCode;
};

// --- ESP32 ---
Arduino["esp32_setup_loop"] = function(block) {
  var setupCode = Arduino.statementToCode(block, "SETUP");
  var loopCode = Arduino.statementToCode(block, "LOOP");
  var autoSetup = "";
  for (var name in Arduino.setups_) { autoSetup += Arduino.setups_[name]; }
  return "void setup(){\n" + autoSetup + (setupCode || "\n") + "}\n\nvoid loop(){\n" + (loopCode || "\n") + "}\n";
};

Arduino["esp32_pin_mode"] = function(block) {
  var pin = block.getFieldValue("PIN");
  var mode = block.getFieldValue("MODE");
  return "pinMode(" + pin + "," + mode + ");\n";
};

Arduino["esp32_digital_write"] = function(block) {
  var pin = block.getFieldValue("PIN");
  var state = block.getFieldValue("STATE");
  return "digitalWrite(" + pin + "," + state + ");\n";
};

Arduino["esp32_digital_read"] = function(block) {
  var pin = block.getFieldValue("PIN");
  return ["digitalRead(" + pin + ")", Arduino.ORDER_ATOMIC];
};

Arduino["esp32_analog_read"] = function(block) {
  var pin = block.getFieldValue("PIN");
  return ["analogRead(" + pin + ")", Arduino.ORDER_ATOMIC];
};

Arduino["esp32_dac_write"] = function(block) {
  var pin = block.getFieldValue("PIN");
  var val = Arduino.valueToCode(block, "VALUE", Arduino.ORDER_ATOMIC) || "0";
  return "dacWrite(" + pin + "," + val + ");\n";
};

Arduino["esp32_pwm_write"] = function(block) {
  var pin = block.getFieldValue("PIN");
  var val = Arduino.valueToCode(block, "VALUE", Arduino.ORDER_ATOMIC) || "0";
  Arduino.setups_["pwm_setup_" + pin] = "  ledcAttachChannel(" + pin + ", 5000, 8, " + pin + ");\n";
  return "ledcWrite(" + pin + "," + val + ");\n";
};

Arduino["esp32_ledc_attach"] = function(block) {
  var pin = block.getFieldValue("PIN");
  var freq = block.getFieldValue("FREQ");
  var res = block.getFieldValue("RES");
  return "ledcAttach(" + pin + ", " + freq + ", " + res + ");\n";
};

Arduino["esp32_ledc_attach_channel"] = function(block) {
  var pin = block.getFieldValue("PIN");
  var freq = block.getFieldValue("FREQ");
  var res = block.getFieldValue("RES");
  var channel = block.getFieldValue("CHANNEL");
  return "ledcAttachChannel(" + pin + ", " + freq + ", " + res + ", " + channel + ");\n";
};

Arduino["esp32_ledc_write_channel"] = function(block) {
  var channel = block.getFieldValue("CHANNEL");
  var val = Arduino.valueToCode(block, "VALUE", Arduino.ORDER_ATOMIC) || "0";
  return "ledcWriteChannel(" + channel + "," + val + ");\n";
};

Arduino["esp32_touch_read"] = function(block) {

  return ["touchRead(" + pin + ")", Arduino.ORDER_ATOMIC];

Arduino["esp32_delay"] = function(block) {
  var ms = Arduino.valueToCode(block, "MS", Arduino.ORDER_ATOMIC) || "1000";

Arduino["esp32_delay_micros"] = function(block) {

Arduino["esp32_stepper_driver_begin"] = function(block) {
  var step = block.getFieldValue("STEP");
  var dir = block.getFieldValue("DIR");
  var spr = block.getFieldValue("SPR");
  var en = block.getFieldValue("EN");
  Arduino.setups_["stepper_step_" + step] = "  pinMode(" + step + ", OUTPUT);\n";
  Arduino.setups_["stepper_dir_" + dir] = "  pinMode(" + dir + ", OUTPUT);\n";
  if (en >= 0) {
    Arduino.setups_["stepper_en_" + en] = "  pinMode(" + en + ", OUTPUT);\n  digitalWrite(" + en + ", LOW);\n";
  }
  Arduino.definitions_["var_stepper_spr_" + step] = "const int stepper_spr_" + step + " = " + spr + ";";
  Arduino.definitions_["var_stepper_delay_" + step] = "int stepper_delayUs_" + step + " = 1000;";
  if (!Arduino.definitions_["func_stepper_move"]) {
    Arduino.definitions_["func_stepper_move"] = 
      "void stepperMove(int stepPin, int dirPin, int steps, int delayUs){\n" +
      "  digitalWrite(dirPin, steps >= 0 ? HIGH : LOW);\n" +
      "  int n = abs(steps);\n" +
      "  for(int i=0; i<n; i++){\n" +
      "    digitalWrite(stepPin, HIGH);\n" +
      "    delayMicroseconds(delayUs);\n" +
      "    digitalWrite(stepPin, LOW);\n" +
      "    delayMicroseconds(delayUs);\n" +
      "  }\n" +
      "}";
  }
  if (!Arduino.definitions_["func_stepper_rotate"]) {
    Arduino.definitions_["func_stepper_rotate"] = 
      "void stepperRotate(int stepPin, int dirPin, int degrees, int spr, int delayUs){\n" +
      "  int steps = (long)degrees * spr / 360;\n" +
      "  stepperMove(stepPin, dirPin, steps, delayUs);\n" +
      "}";
  }
  return "";
};

Arduino["esp32_inmp441_begin"] = function(block) {

  Arduino.definitions_["include_i2s"] = "#include <driver/i2s.h>";
  Arduino.definitions_["func_inmp441_read"] =
    "int readINMP441Level(){\n" +
    "  int32_t buf[64];\n" +
    "  size_t bytesRead = 0;\n" +
    "  i2s_read(I2S_NUM_0, &buf, sizeof(buf), &bytesRead, portMAX_DELAY);\n" +
    "  int samples = bytesRead / sizeof(int32_t);\n" +
    "  long sum = 0;\n" +
    "  for (int i=0;i<samples;i++){\n" +
    "    int32_t s = buf[i] >> 11;\n" +
    "    if (s < 0) s = -s;\n" +
    "    sum += s;\n" +
    "  }\n" +
    "  return samples>0 ? (sum/samples) : 0;\n" +
    "}";
  return "{\n" +
    "  i2s_config_t i2s_cfg = {\n" +
    "    .mode = (i2s_mode_t)(I2S_MODE_MASTER | I2S_MODE_RX),\n" +
    "    .sample_rate = " + rate + ",\n" +
    "    .bits_per_sample = I2S_BITS_PER_SAMPLE_32BIT,\n" +
    "    .channel_format = I2S_CHANNEL_FMT_ONLY_LEFT,\n" +
    "    .communication_format = I2S_COMM_FORMAT_STAND_I2S,\n" +
    "    .intr_alloc_flags = 0,\n" +
    "    .dma_buf_count = 4,\n" +
    "    .dma_buf_len = 256\n" +
    "  };\n" +
    "  i2s_pin_config_t i2s_pins = {\n" +
    "    .bck_io_num = " + sck + ",\n" +

// Helper para convertir MAC string a array de bytes C++
function espNowMacToArray(macStr) {
  var parts = macStr.split(':');
  if (parts.length !== 6) return null;
  var bytes = [];
  for (var i = 0; i < 6; i++) {
    bytes.push("0x" + parts[i].toUpperCase());
  }
  return "{ " + bytes.join(", ") + " }";
}

function espNowMacVarName(macStr) {
  return "macAddr_" + macStr.replace(/:/g, "_");
}

  Arduino.definitions_["var_espnow_outgoing"] = "esp_now_msg_t espNowOutgoing;";
  Arduino.definitions_["var_espnow_flag"] = "volatile bool espNowDataReceived = false;";
  Arduino.definitions_["var_espnow_peerinfo"] = "esp_now_peer_info_t espNowPeerInfo;";
  Arduino.definitions_["func_espnow_recv"] = 
    "void OnEspNowRecv(const uint8_t *mac, const uint8_t *data, int len) {\n" +
    "  memcpy(&espNowIncoming, data, min(len, sizeof(espNowIncoming)));\n" +
    "  espNowDataReceived = true;\n" +
    "}\n";
  Arduino.definitions_["func_espnow_sent"] = 
    "void OnEspNowSent(const uint8_t *mac_addr, esp_now_send_status_t status) {\n" +
    "  // Envio completado\n" +
    "}\n";
  return "WiFi.mode(WIFI_STA);\n" +
         "if (esp_now_init() != ESP_OK) {\n" +
         "  Serial.println(\"Error inicializando ESP-NOW\");\n" +
         "} else {\n" +
         "  esp_now_register_recv_cb(OnEspNowRecv);\n" +
         "  esp_now_register_send_cb(OnEspNowSent);\n" +
         "}\n";
};

Arduino["esp32_now_add_peer"] = function(block) {
  var macStr = block.getFieldValue("MAC");

  if (macArray && !Arduino.definitions_["mac_def_" + macStr]) {

  }
  var code = "memcpy(espNowPeerInfo.peer_addr, " + macVar + ", 6);\n";
  code += "espNowPeerInfo.channel = 0;\n";
  code += "espNowPeerInfo.encrypt = false;\n";
  code += "if (esp_now_add_peer(&espNowPeerInfo) != ESP_OK) {\n";

Arduino.quote_ = function(string) {
  string = string.replace(/\\/g, "\\\\");
  string = string.replace(/"/g, '\\"');
  string = string.replace(/\n/g, "\\n");
  return '"' + string + '"';
};

Arduino["text"] = function(block) {

Arduino["text_join"] = function(block) {
  var n = 0;
  var parts = [];
  while (block.getInput("ADD" + n)) {
    var part = Arduino.valueToCode(block, "ADD" + n, Arduino.ORDER_NONE);
    if (part) parts.push("String(" + part + ")");
    n++;
  }
  if (parts.length === 0) return ['""', Arduino.ORDER_ATOMIC];
  return [parts.join(" + "), Arduino.ORDER_ATOMIC];
};

Arduino["logic_compare"] = function(block) {
  var OPS = {"EQ":"==","NEQ":"!=","LT":"<","LTE":"<=","GT":">","GTE":">="};
  var op = OPS[block.getFieldValue("OP")];
  var a = Arduino.valueToCode(block, "A", 6) || "0";
  var b = Arduino.valueToCode(block, "B", 6) || "0";
  return [a + " " + op + " " + b, 6];
};

Arduino["logic_operation"] = function(block) {
  var op = (block.getFieldValue("OP") == "AND") ? "&&" : "||";
  var order = (op == "&&") ? 11 : 12;
  var a = Arduino.valueToCode(block, "A", order) || "false";
  var b = Arduino.valueToCode(block, "B", order) || "false";
  return [a + " " + op + " " + b, order];
};

Arduino["logic_negate"] = function(block) {
  var a = Arduino.valueToCode(block, "BOOL", 2) || "false";
  return ["!" + a, 2];
};

Arduino["logic_boolean"] = function(block) {
  return [(block.getFieldValue("BOOL") == "TRUE") ? "true" : "false", Arduino.ORDER_ATOMIC];
};

Arduino["controls_if"] = function(block) {
  var n = 0, code = "", branchCode, condCode;
  do {
    condCode = Arduino.valueToCode(block, "IF" + n, Arduino.ORDER_NONE) || "false";
    branchCode = Arduino.statementToCode(block, "DO" + n);
    code += (n == 0 ? "" : "else ") + "if (" + condCode + "){\n" + branchCode + "}";
    n++;
  } while (block.getInput("IF" + n));
  if (block.getInput("ELSE")) {
    branchCode = Arduino.statementToCode(block, "ELSE");
    code += "else {\n" + branchCode + "}";
  }
  return code + "\n";
};

Arduino["controls_ifelse"] = Arduino["controls_if"];

Arduino["controls_repeat_ext"] = function(block) {
  var repeats = Arduino.valueToCode(block, "TIMES", 4) || "0";
  var branch = Arduino.statementToCode(block, "DO");
  return "for (int i=0;i<" + repeats + ";i++){\n" + branch + "}\n";
};

Arduino["controls_whileUntil"] = function(block) {
  var until = block.getFieldValue("MODE") == "UNTIL";
  var arg = Arduino.valueToCode(block, "BOOL", Arduino.ORDER_NONE) || "false";
  if (until) arg = "!" + arg;
  var branch = Arduino.statementToCode(block, "DO");
  return "while (" + arg + "){\n" + branch + "}\n";
};

Arduino["controls_for"] = function(block) {
  var v = Arduino.nameDB_.getName(block.getFieldValue("VAR"), "VARIABLE");

// ========== INFERENCIA DE TIPOS DE VARIABLES ==========
function inferVariableTypes(workspace) {
  if (!workspace) return { types: {}, conflicts: {} };
  var types = {};
  var seenTypes = {}; // varName -> { tipo: true, ... } (todos los tipos distintos vistos)
  var blocks = workspace.getAllBlocks(false);

  for (var i = 0; i < blocks.length; i++) {
    var block = blocks[i];
    if (block.type === "variables_set") {
      var varId = block.getFieldValue("VAR");
      if (!varId) continue;
      var varName = Arduino.nameDB_.getName(varId, "VARIABLE");
      var target = block.getInputTargetBlock("VALUE");
      var inferred = inferBlockType(target);

      if (inferred !== "unknown") {
        var norm = (inferred === "number") ? "float" : inferred;
        if (!seenTypes[varName]) seenTypes[varName] = {};
        seenTypes[varName][norm] = true;
      }
      if (inferred !== "unknown" && inferred !== "number") {
        types[varName] = inferred;
      } else if (!types[varName]) {
        types[varName] = "float";
      }
    }
  }

  var conflicts = {};
  for (var v in seenTypes) {
    var distinct = Object.keys(seenTypes[v]);
    if (distinct.length > 1) conflicts[v] = distinct;
  }
  return { types: types, conflicts: conflicts };
}

function inferBlockType(block) {
  if (!block) return "unknown";
  var type = block.type;
  // Bloques de texto
  if (type === "text" || type === "text_join" || type === "text_length" || 
      type === "text_indexOf" || type === "text_charAt" || type === "text_getSubstring" ||
      type === "text_changeCase" || type === "text_trim" || type === "text_prompt_ext" ||
      type === "esp32_wifi_localip" || type === "esp32_rfid_read_uid" || type === "esp32_ble_get_value") {
    return "String";
  }
  // Bloques booleanos
  if (type === "logic_boolean" || type === "logic_compare" || type === "logic_operation" || 
      type === "logic_negate" || type === "math_number_property" || type === "text_isEmpty" ||
      type === "esp32_button" || type === "esp32_digital_read" || type === "esp32_wifi_connected" ||
      type === "esp32_ble_connected" || type === "esp32_pir_read" || type === "esp32_flame_sensor" ||
      type === "esp32_ir_obstacle" || type === "esp32_rfid_present" || type === "esp32_ld2410_presence") {
    return "bool";
  }
  // Bloques numéricos
  if (type.indexOf("math_") === 0 || type.indexOf("esp32_analog_read") === 0 ||
      type.indexOf("esp32_touch_read") === 0 || type.indexOf("esp32_dht_") === 0 ||
      type.indexOf("esp32_ultrasonic_read") === 0 || type.indexOf("esp32_hall_read") === 0 ||
      type.indexOf("esp32_potentiometer") === 0 || type.indexOf("esp32_ldr") === 0 ||
      type.indexOf("esp32_soil_moisture") === 0 || type.indexOf("esp32_rain_sensor") === 0 ||
      type.indexOf("esp32_mq") === 0 || type.indexOf("esp32_bmp280_") === 0 ||
      type.indexOf("esp32_ld2410_distance") === 0 || type.indexOf("esp32_tcs3200_read") === 0 ||
      type.indexOf("esp32_inmp441_read_level") === 0 || type.indexOf("esp32_ds18b20_read") === 0 ||
      type.indexOf("esp32_mpu6050_") === 0 || type.indexOf("esp32_map") === 0 ||
      type.indexOf("esp32_millis") === 0 || type.indexOf("esp32_random") === 0 ||
      type.indexOf("esp32_ky038_analog") === 0 ||
      type.indexOf("esp32_tds_read") === 0) {
    return "float";
  }
  // Si es una variable, seguir la cadena
  if (type === "variables_get") {
    return "unknown"; // Se resolverá en la segunda pasada
  }
  return "unknown";
}

// Marca con un icono de advertencia los bloques "variables_set"/"variables_get"
// cuya variable se usa con mas de un tipo de dato en el workspace.
function applyVariableConflictWarnings(workspace, conflicts) {
  if (!workspace) return;
  var blocks = workspace.getAllBlocks(false);
  for (var i = 0; i < blocks.length; i++) {
    var block = blocks[i];
    if (block.type !== "variables_set" && block.type !== "variables_get") continue;
    if (typeof block.setWarningText !== "function") continue;
    var varId = block.getFieldValue("VAR");
    var varName = varId ? Arduino.nameDB_.getName(varId, "VARIABLE") : null;
    if (varName && conflicts[varName]) {
      block.setWarningText(
        'La variable "' + varName + '" se esta usando con mas de un tipo de dato (' +
        conflicts[varName].join(", ") + '). Arduino no permite eso: usa una variable ' +
        'distinta para cada tipo de dato.'
      );
    } else {
      block.setWarningText(null);
    }
  }
}

function cargarEjemplo(tipo) {
  try {
    var xmlText = EJEMPLOS[tipo];
    if (!xmlText) { showStatus("Ejemplo no encontrado: " + tipo, "err"); return; }
    var xmlDom = Blockly.utils.xml.textToDom(xmlText);
    workspace.clear();
    Blockly.Xml.domToWorkspace(xmlDom, workspace);
    showStatus("Ejemplo cargado: " + tipo, "info");
  } catch (err) {
    console.error(err);
    showStatus("Error cargando ejemplo: " + err.message, "err");
  }
}

// ========== GUARDAR / CARGAR ==========
function guardarProyecto() {
  try {
    var xml = Blockly.Xml.workspaceToDom(workspace);
    var xmlText = Blockly.Xml.domToText(xml);
    var blob = new Blob([xmlText], {type: "application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "proyecto_esp32.json";
    a.click();
    showStatus("Proyecto guardado.", "ok");
  } catch (err) { showStatus("Error al guardar: " + err.message, "err"); }
}

function cargarProyecto(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var xmlDom = Blockly.utils.xml.textToDom(e.target.result);
      workspace.clear();
      Blockly.Xml.domToWorkspace(xmlDom, workspace);
      showStatus("Proyecto cargado.", "ok");
    } catch (err) { showStatus("Error al cargar: " + err.message, "err"); }
  };
  reader.readAsText(file);
  input.value = "";
}

// ========== GENERAR / DESCARGAR / SUBIR ==========
function generarCodigo() {
  try {
    var code = Arduino.workspaceToCode(workspace);
    document.getElementById("codeArea").value = code;
    var conflicts = Arduino.varTypeConflicts_ || {};
    var conflictNames = Object.keys(conflicts);
    if (conflictNames.length > 0) {
      showStatus(
        "Atencion: la variable \"" + conflictNames.join('", "') +
        "\" se usa con mas de un tipo de dato. Revisa los bloques marcados con ! " +
        "y usa una variable distinta para cada tipo.",
        "err"
      );
    } else {
      showStatus("Codigo generado correctamente.", "info");
    }
    return code;
  } catch (e) {
    document.getElementById("codeArea").value = "ERROR: " + e.message;
    showStatus("Error al generar codigo.", "err");
    console.error(e);
    return null;
  }
}

function descargarCodigo() {
  var code = document.getElementById("codeArea").value;
  if (!code || code.startsWith("ERROR")) {
    showStatus("Primero genera el codigo.", "err");
    return;
  }
  var blob = new Blob([code], {type: "text/plain"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sketch_esp32.ino";
  a.click();
  showStatus("Archivo descargado.", "ok");
}

var MODELO_A_BOARD = { dev: "esp32", s3: "esp32s3", c3: "esp32c3", c6: "esp32c6" };

var uploadJobId = null;
var uploadPollInterval = null;

async function subirAAduino() {
  var code = generarCodigo();
  if (!code) return;
  var conflicts = Arduino.varTypeConflicts_ || {};
  var conflictNames = Object.keys(conflicts);
  if (conflictNames.length > 0) {
    showStatus(
      "No se puede subir: la variable \"" + conflictNames.join('", "') +
      "\" se usa con mas de un tipo de dato. Corrige los bloques marcados con ! antes de subir.",
      "err"
    );
    return;
  }
  // El agente detiene el monitor serial del lado del servidor antes de
  // subir (necesita el puerto libre). Lo cerramos aqui tambien en el
  // navegador para que el indicador ("Monitor activo") no quede encendido
  // engañosamente mientras se sube el codigo.
  if (eventSource) { detenerMonitor(); }

  var modelo = document.getElementById("espModel").value;
  var boardKey = MODELO_A_BOARD[modelo] || "esp32";
  var btn = document.getElementById("btnSubir");
  var originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Iniciando...';

  // Obtener puerto seleccionado manualmente si existe
  var manualPort = document.getElementById("manualPort").value;

  showStatus("Iniciando subida a " + MODELOS[modelo].name + "...", "info");
  document.getElementById("compileLogPanel").style.display = "block";
  document.getElementById("compileLogArea").value = "";
  document.getElementById("btnCancelar").disabled = false;

  try {
    var payload = {code: code, board: boardKey};
    if (manualPort) payload.port = manualPort;

    var response = await fetch("http://localhost:5000/upload", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    var result = await response.json();
    if (result.success && result.job_id) {
      uploadJobId = result.job_id;
      btn.innerHTML = '<span class="spinner"></span>Subiendo...';
      showStatus("Subida en progreso. ID: " + uploadJobId, "info");
      iniciarPollingSubida();
    } else {
      showStatus(result.error || "Error iniciando subida.", "err");
      btn.disabled = false;
      btn.innerHTML = originalText;
      document.getElementById("btnCancelar").disabled = true;
    }
  } catch (err) {
    showStatus("No se pudo conectar con el agente local. Verifica que este ejecutandose.", "err");
    btn.disabled = false;
    btn.innerHTML = originalText;
    document.getElementById("btnCancelar").disabled = true;
  }
}

function iniciarPollingSubida() {
  if (uploadPollInterval) clearInterval(uploadPollInterval);
  uploadPollInterval = setInterval(pollUploadStatus, 800);
}

async function pollUploadStatus() {
  if (!uploadJobId) return;
  try {
    var res = await fetch("http://localhost:5000/upload/status/" + uploadJobId);
    var data = await res.json();
    if (!data.success) return;

    // Actualizar logs
    var logArea = document.getElementById("compileLogArea");
    var newLogs = data.logs.join("\n");
    if (logArea.value !== newLogs) {
      logArea.value = newLogs;
      logArea.scrollTop = logArea.scrollHeight;
    }

    var btn = document.getElementById("btnSubir");
    var status = data.status;

    if (status === "success") {
      clearInterval(uploadPollInterval);
      uploadPollInterval = null;
      uploadJobId = null;
      btn.disabled = false;
      btn.innerHTML = 'Subir a ESP32';
      document.getElementById("btnCancelar").disabled = true;
      showStatus("Subida exitosa a " + data.board + " en puerto " + data.port + "!", "ok");
    } else if (status === "error") {
      clearInterval(uploadPollInterval);
      uploadPollInterval = null;
      uploadJobId = null;
      btn.disabled = false;
      btn.innerHTML = 'Subir a ESP32';
      document.getElementById("btnCancelar").disabled = true;
      showStatus("Error: " + (data.error || "Revisa el log de compilacion."), "err");
    } else if (status === "cancelled") {
      clearInterval(uploadPollInterval);
      uploadPollInterval = null;
      uploadJobId = null;
      btn.disabled = false;
      btn.innerHTML = 'Subir a ESP32';
      document.getElementById("btnCancelar").disabled = true;
      showStatus("Subida cancelada por el usuario.", "info");
    }
  } catch (e) {}
}

async function cancelarSubida() {
  if (!uploadJobId) return;
  try {
    await fetch("http://localhost:5000/upload/cancel/" + uploadJobId, {method: "POST"});
    document.getElementById("btnCancelar").disabled = true;
    showStatus("Cancelando subida...", "info");
  } catch (e) {
    showStatus("Error al cancelar.", "err");
  }
}

// ========== INDICADOR DE CONEXION ==========
var connPollInterval = null;

function iniciarMonitoreoConexion() {
  actualizarConexion();
  if (connPollInterval) clearInterval(connPollInterval);
  connPollInterval = setInterval(actualizarConexion, 3000);
}

async function actualizarConexion() {
  try {
    var res = await fetch("http://localhost:5000/status");
    var data = await res.json();
    var dot = document.getElementById("connDot");
    var text = document.getElementById("connText");
    var portSpan = document.getElementById("connPort");
    var manualSelect = document.getElementById("manualPort");
    document.getElementById("downloadAgentBtn").style.display = "none";

    if (data.detected_port) {
      dot.classList.add("connected");
      text.textContent = "Conectado";
      portSpan.textContent = data.detected_port;
    } else if (data.ports && data.ports.length > 0) {
      dot.classList.remove("connected");
      text.textContent = "Puertos detectados";
      portSpan.textContent = data.ports.length + " disponibles";
    } else {
      dot.classList.remove("connected");
      text.textContent = "Sin dispositivo";
      portSpan.textContent = "";
    }

    // Actualizar dropdown de puertos manuales
    var currentVal = manualSelect.value;
    manualSelect.innerHTML = '<option value="">-- Puerto --</option>';
    if (data.ports && data.ports.length > 0) {
      manualSelect.style.display = "inline-block";
      data.ports.forEach(function(p) {
        var opt = document.createElement("option");
        opt.value = p.device;
        opt.textContent = p.device + " (" + (p.description || "?").substring(0, 20) + ")";
        if (p.device === currentVal) opt.selected = true;
        manualSelect.appendChild(opt);
      });
    } else {
      manualSelect.style.display = "none";
    }
  } catch (e) {
    var dot = document.getElementById("connDot");
    var text = document.getElementById("connText");
    dot.classList.remove("connected");
    text.textContent = "Agente offline";
    document.getElementById("connPort").textContent = "";
    document.getElementById("manualPort").style.display = "none";
    document.getElementById("downloadAgentBtn").style.display = "inline-block";
  }
}

// Iniciar monitoreo al cargar
iniciarMonitoreoConexion();


function showStatus(msg, type) {
  var el = document.getElementById("statusArea");
  el.textContent = msg;
  el.className = "";
  if (type === "ok") el.classList.add("status-ok");
  else if (type === "err") el.classList.add("status-err");
  else el.classList.add("status-info");
}

// ========== MONITOR SERIAL ==========
var eventSource = null;
var serialLines = [];
var maxSerialLines = 500;

function iniciarMonitor() {
  if (eventSource) { showStatus("El monitor ya esta activo.", "info"); return; }
  var baud = document.getElementById("serialBaud").value;
  fetch("http://localhost:5000/serial/start", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({baud: parseInt(baud)})
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.success) {
      conectarSSE();
      document.getElementById("serialStatus").classList.add("active");
      showStatus(data.message, "ok");
    } else { showStatus(data.message, "err"); }
  })
  .catch(function(err) { showStatus("Error al iniciar monitor: " + err.message, "err"); });
}

function conectarSSE() {
  eventSource = new EventSource("http://localhost:5000/serial/stream");
  eventSource.onmessage = function(e) {
    agregarLineaSerial(e.data);
  };
  eventSource.onerror = function() {
    document.getElementById("serialStatus").classList.remove("active");
  };
}

function detenerMonitor() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  fetch("http://localhost:5000/serial/stop", {method: "POST"})
  .then(function(res) { return res.json(); })
  .then(function(data) {
    document.getElementById("serialStatus").classList.remove("active");
    showStatus(data.message, "info");
  })
  .catch(function(err) { showStatus("Error al detener: " + err.message, "err"); });
}

function limpiarMonitor() {
  serialLines = [];
  document.getElementById("serialOutput").textContent = "";
}

function agregarLineaSerial(texto) {
  var output = document.getElementById("serialOutput");
  var timestamp = new Date().toLocaleTimeString("es-ES", {hour12: false});
  var partes = texto.split("\n");
  for (var i = 0; i < partes.length; i++) {
    if (partes[i] === "" && i === partes.length - 1) continue;
    serialLines.push("[" + timestamp + "] " + partes[i]);
  }
  if (serialLines.length > maxSerialLines) {
    serialLines = serialLines.slice(serialLines.length - maxSerialLines);
  }
  output.textContent = serialLines.join("\n");
  output.scrollTop = output.scrollHeight;
}

// ========== WORKSPACE ==========
var workspace = Blockly.inject("blocklyDiv", {
  toolbox: document.getElementById("toolbox"),
  trashcan: true,
  zoom: { controls: true, wheel: true, startScale: 1.0, maxScale: 3, minScale: 0.3, scaleSpeed: 1.2 },
  grid: { spacing: 20, length: 3, colour: "#ccc", snap: true }
});
console.log("Workspace ESP32 listo");

// ========== CODIGO EN VIVO ==========
var liveCodeTimer = null;
workspace.addChangeListener(function(event) {
  if (workspace.isDragging && workspace.isDragging()) return;
  if (Blockly.Events.isUiEvent && Blockly.Events.isUiEvent(event)) return;
  if (event.type === Blockly.Events.UI) return;
  clearTimeout(liveCodeTimer);
  liveCodeTimer = setTimeout(function() {
    try {
      var code = Arduino.workspaceToCode(workspace);
      document.getElementById("codeArea").value = code;
    } catch (e) {}
  }, 300);
});

async function limpiarEspacio() {
  try {
    showStatus("Limpiando espacio en disco...", "info");
    var res = await fetch("http://localhost:5000/clean", {method: "POST"});
    var data = await res.json();
    if (data.success && data.actions) {
      showStatus("Espacio liberado: " + data.actions.join(" | "), "ok");
    } else {
      showStatus("No se pudo limpiar el espacio.", "err");
    }
  } catch (err) {
    showStatus("Error al limpiar: " + err.message, "err");
  }
}
