<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Blockly Arduino Nano</title>
  <script src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/msg/es.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; }
    h2 { color: #333; margin-bottom: 10px; }
    #blocklyDiv { height: 480px; width: 100%; border: 2px solid #00979D; border-radius: 8px; background: #fff; }
    .controls { margin-top: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button { padding: 12px 20px; font-size: 15px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: all 0.2s; }
    button:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .btn-generar { background: #00979D; color: white; }
    .btn-generar:hover { background: #007a82; }
    .btn-descargar { background: #6c757d; color: white; }
    .btn-descargar:hover { background: #5a6268; }
    .btn-subir { background: #28a745; color: white; }
    .btn-subir:hover { background: #218838; }
    .btn-subir:disabled { background: #6c757d; cursor: not-allowed; transform: none; }
    #codeArea { width: 100%; height: 200px; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; margin-top: 12px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: #1e1e1e; color: #d4d4d4; resize: vertical; }
    .hint { color: #666; font-size: 13px; }
    #statusArea { margin-top: 10px; padding: 10px 14px; border-radius: 6px; font-size: 14px; display: none; align-items: center; gap: 8px; }
    .status-ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: flex !important; }
    .status-err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: flex !important; }
    .status-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; display: flex !important; }
    .spinner { width: 16px; height: 16px; border: 2px solid #ccc; border-top: 2px solid #00979D; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
<base target="_blank">
</head>
<body>
  <h2>🧩 Programa tu Arduino Nano con Bloques</h2>

  <div id="blocklyDiv"></div>

  <xml id="toolbox" style="display: none">
    <category name="⚡ Arduino" colour="#00979D">
      <block type="arduino_setup_loop"></block>
      <block type="arduino_pin_mode"></block>
      <block type="arduino_digital_write"></block>
      <block type="arduino_digital_read"></block>
      <block type="arduino_analog_write"></block>
      <block type="arduino_analog_read"></block>
      <block type="arduino_delay"></block>
      <block type="arduino_serial_begin"></block>
      <block type="arduino_serial_print"></block>
      <block type="arduino_serial_println"></block>
    </category>
    <category name="🔁 Control" colour="#FFAB19">
      <block type="controls_if"></block>
      <block type="controls_ifelse"></block>
      <block type="controls_repeat_ext">
        <value name="TIMES"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
      </block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for"></block>
    </category>
    <category name="🔍 Lógica" colour="#59C059">
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
    </category>
    <category name="🔢 Matemáticas" colour="#59C059">
      <block type="math_number"><field name="NUM">0</field></block>
      <block type="math_arithmetic"></block>
      <block type="math_random_int"></block>
    </category>
    <category name="📦 Variables" colour="#FF8C1A" custom="VARIABLE"></category>
  </xml>

  <div class="controls">
    <button class="btn-generar" onclick="generarCodigo()">⚙️ Generar Código</button>
    <button class="btn-descargar" onclick="descargarCodigo()">💾 Descargar .ino</button>
    <button class="btn-subir" id="btnSubir" onclick="subirAAduino()">📤 Subir a Arduino</button>
    <span class="hint">Conecta el Nano y ejecuta <code>agente_local.py</code> para subir directo</span>
  </div>

  <div id="statusArea"></div>
  <textarea id="codeArea" placeholder="El código Arduino aparecerá aquí..."></textarea>

  <script>
    // ============================================
    // 1. INICIALIZAR WORKSPACE
    // ============================================
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      trashcan: true,
      zoom: { controls: true, wheel: true, startScale: 1.0, maxScale: 3, minScale: 0.3, scaleSpeed: 1.2 },
      grid: { spacing: 20, length: 3, colour: '#ccc', snap: true }
    });

    // ============================================
    // 2. DEFINIR BLOQUES PERSONALIZADOS
    // ============================================

    Blockly.Blocks['arduino_setup_loop'] = {
      init: function() {
        this.setColour(0);
        this.appendDummyInput().appendField("🟦 Arduino Nano");
        this.appendStatementInput("SETUP").setCheck(null).appendField("setup");
        this.appendStatementInput("LOOP").setCheck(null).appendField("loop");
        this.setTooltip("Bloque principal. Todo el código debe ir dentro de setup o loop.");
        this.setDeletable(false);
      }
    };

    Blockly.Blocks['arduino_pin_mode'] = {
      init: function() {
        this.setColour(0);
        this.appendDummyInput()
            .appendField("pinMode pin")
            .appendField(new Blockly.FieldNumber(13, 0, 19), "PIN")
            .appendField(new Blockly.FieldDropdown([["OUTPUT","OUTPUT"],["INPUT","INPUT"],["INPUT_PULLUP","INPUT_PULLUP"]]), "MODE");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setTooltip("Configura un pin como entrada o salida.");
      }
    };

    Blockly.Blocks['arduino_digital_write'] = {
      init: function() {
        this.setColour(0);
        this.appendDummyInput()
            .appendField("digitalWrite pin")
            .appendField(new Blockly.FieldNumber(13, 0, 19), "PIN")
            .appendField(new Blockly.FieldDropdown([["HIGH","HIGH"],["LOW","LOW"]]), "STATE");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setTooltip("Escribe HIGH o LOW en un pin digital.");
      }
    };

    Blockly.Blocks['arduino_digital_read'] = {
      init: function() {
        this.setColour(0);
        this.appendDummyInput()
            .appendField("digitalRead pin")
            .appendField(new Blockly.FieldNumber(2, 0, 19), "PIN");
        this.setOutput(true, 'Number');
        this.setTooltip("Lee el estado de un pin digital (0 o 1).");
      }
    };

    Blockly.Blocks['arduino_analog_write'] = {
      init: function() {
        this.setColour(0);
        this.appendDummyInput().appendField("analogWrite pin");
        this.appendDummyInput().appendField(new Blockly.FieldDropdown([["3","3"],["5","5"],["6","6"],["9","9"],["10","10"],["11","11"]]), "PIN");
        this.appendValueInput("VALUE").setCheck("Number");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setTooltip("Escribe un valor PWM (0-255) en pines ~3, ~5, ~6, ~9, ~10, ~11.");
        this.setInputsInline(true);
      }
    };

    Blockly.Blocks['arduino_analog_read'] = {
      init: function() {
        this.setColour(0);
        this.appendDummyInput()
            .appendField("analogRead pin A")
            .appendField(new Blockly.FieldDropdown([["0","A0"],["1","A1"],["2","A2"],["3","A3"],["4","A4"],["5","A5"],["6","A6"],["7","A7"]]), "PIN");
        this.setOutput(true, 'Number');
        this.setTooltip("Lee un valor analógico (0-1023) del pin A0-A7.");
      }
    };

    Blockly.Blocks['arduino_delay'] = {
      init: function() {
        this.setColour(0);
        this.appendValueInput("MS").setCheck("Number").appendField("delay");
        this.appendDummyInput().appendField("ms");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setTooltip("Pausa la ejecución por X milisegundos.");
        this.setInputsInline(true);
      }
    };

    Blockly.Blocks['arduino_serial_begin'] = {
      init: function() {
        this.setColour(0);
        this.appendDummyInput()
            .appendField("Serial.begin")
            .appendField(new Blockly.FieldDropdown([["9600","9600"],["115200","115200"],["57600","57600"]]), "BAUD");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setTooltip("Inicia la comunicación serial a la velocidad indicada.");
      }
    };

    Blockly.Blocks['arduino_serial_print'] = {
      init: function() {
        this.setColour(0);
        this.appendValueInput("TEXT").setCheck(null).appendField("Serial.print");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setTooltip("Imprime un valor en el monitor serial (sin salto de línea).");
      }
    };

    Blockly.Blocks['arduino_serial_println'] = {
      init: function() {
        this.setColour(0);
        this.appendValueInput("TEXT").setCheck(null).appendField("Serial.println");
        this.setPreviousStatement(true, null);
        this.setNextStatement(true, null);
        this.setTooltip("Imprime un valor en el monitor serial (con salto de línea).");
      }
    };

    // ============================================
    // 3. CREAR GENERADOR ARDUINO
    // ============================================
    Blockly.Arduino = new Blockly.Generator('Arduino');

    Blockly.Arduino.ORDER_ATOMIC = 0;
    Blockly.Arduino.ORDER_UNARY_POSTFIX = 1;
    Blockly.Arduino.ORDER_UNARY_PREFIX = 2;
    Blockly.Arduino.ORDER_MULTIPLICATIVE = 3;
    Blockly.Arduino.ORDER_ADDITIVE = 4;
    Blockly.Arduino.ORDER_SHIFT = 5;
    Blockly.Arduino.ORDER_RELATIONAL = 6;
    Blockly.Arduino.ORDER_EQUALITY = 7;
    Blockly.Arduino.ORDER_BITWISE_AND = 8;
    Blockly.Arduino.ORDER_BITWISE_XOR = 9;
    Blockly.Arduino.ORDER_BITWISE_OR = 10;
    Blockly.Arduino.ORDER_LOGICAL_AND = 11;
    Blockly.Arduino.ORDER_LOGICAL_OR = 12;
    Blockly.Arduino.ORDER_CONDITIONAL = 13;
    Blockly.Arduino.ORDER_ASSIGNMENT = 14;
    Blockly.Arduino.ORDER_COMMA = 15;
    Blockly.Arduino.ORDER_NONE = 99;

    Blockly.Arduino.init = function(workspace) {
      this.definitions_ = Object.create(null);
      this.functionNames_ = Object.create(null);
      this.nameDB_ = new Blockly.Names(this.RESERVED_WORDS_ || '');
      this.nameDB_.setVariableMap(workspace.getVariableMap());
      this.nameDB_.populateProcedures(workspace);
    };

    Blockly.Arduino.finish = function(code) {
      const definitions = [];
      for (let name in this.definitions_) {
        definitions.push(this.definitions_[name]);
      }
      this.definitions_ = Object.create(null);
      this.functionNames_ = Object.create(null);
      if (this.nameDB_) this.nameDB_.reset();
      return definitions.join('\n') + '\n' + code;
    };

    Blockly.Arduino.scrub_ = function(block, code, opt_thisOnly) {
      const nextBlock = block.nextConnection && block.nextConnection.targetBlock();
      const nextCode = opt_thisOnly ? '' : this.blockToCode(nextBlock);
      return code + nextCode;
    };

    // ============================================
    // 4. GENERADORES DE BLOQUES ARDUINO
    // ============================================

    Blockly.Arduino['arduino_setup_loop'] = function(block) {
      const setupCode = Blockly.Arduino.statementToCode(block, 'SETUP');
      const loopCode = Blockly.Arduino.statementToCode(block, 'LOOP');
      return 'void setup() {\n' + (setupCode || '  \n') + '}\n\nvoid loop() {\n' + (loopCode || '  \n') + '}\n';
    };

    Blockly.Arduino['arduino_pin_mode'] = function(block) {
      const pin = block.getFieldValue('PIN');
      const mode = block.getFieldValue('MODE');
      return '  pinMode(' + pin + ', ' + mode + ');\n';
    };

    Blockly.Arduino['arduino_digital_write'] = function(block) {
      const pin = block.getFieldValue('PIN');
      const state = block.getFieldValue('STATE');
      return '  digitalWrite(' + pin + ', ' + state + ');\n';
    };

    Blockly.Arduino['arduino_digital_read'] = function(block) {
      const pin = block.getFieldValue('PIN');
      return ['digitalRead(' + pin + ')', Blockly.Arduino.ORDER_ATOMIC];
    };

    Blockly.Arduino['arduino_analog_write'] = function(block) {
      const pin = block.getFieldValue('PIN');
      const value = Blockly.Arduino.valueToCode(block, 'VALUE', Blockly.Arduino.ORDER_ATOMIC) || '0';
      return '  analogWrite(' + pin + ', ' + value + ');\n';
    };

    Blockly.Arduino['arduino_analog_read'] = function(block) {
      const pin = block.getFieldValue('PIN');
      return ['analogRead(' + pin + ')', Blockly.Arduino.ORDER_ATOMIC];
    };

    Blockly.Arduino['arduino_delay'] = function(block) {
      const ms = Blockly.Arduino.valueToCode(block, 'MS', Blockly.Arduino.ORDER_ATOMIC) || '1000';
      return '  delay(' + ms + ');\n';
    };

    Blockly.Arduino['arduino_serial_begin'] = function(block) {
      const baud = block.getFieldValue('BAUD');
      return '  Serial.begin(' + baud + ');\n';
    };

    Blockly.Arduino['arduino_serial_print'] = function(block) {
      const text = Blockly.Arduino.valueToCode(block, 'TEXT', Blockly.Arduino.ORDER_ATOMIC) || '""';
      return '  Serial.print(' + text + ');\n';
    };

    Blockly.Arduino['arduino_serial_println'] = function(block) {
      const text = Blockly.Arduino.valueToCode(block, 'TEXT', Blockly.Arduino.ORDER_ATOMIC) || '""';
      return '  Serial.println(' + text + ');\n';
    };

    // ============================================
    // 5. GENERADORES DE BLOQUES NATIVOS
    // ============================================

    Blockly.Arduino['math_number'] = function(block) {
      const code = Number(block.getFieldValue('NUM'));
      return [code.toString(), Blockly.Arduino.ORDER_ATOMIC];
    };

    Blockly.Arduino['math_arithmetic'] = function(block) {
      const OPERATORS = {
        'ADD': [' + ', Blockly.Arduino.ORDER_ADDITIVE],
        'MINUS': [' - ', Blockly.Arduino.ORDER_ADDITIVE],
        'MULTIPLY': [' * ', Blockly.Arduino.ORDER_MULTIPLICATIVE],
        'DIVIDE': [' / ', Blockly.Arduino.ORDER_MULTIPLICATIVE],
        'POWER': [' ^ ', Blockly.Arduino.ORDER_NONE]
      };
      const tuple = OPERATORS[block.getFieldValue('OP')];
      const argument0 = Blockly.Arduino.valueToCode(block, 'A', tuple[1]) || '0';
      const argument1 = Blockly.Arduino.valueToCode(block, 'B', tuple[1]) || '0';
      const code = argument0 + tuple[0] + argument1;
      return [code, tuple[1]];
    };

    Blockly.Arduino['math_random_int'] = function(block) {
      const argument0 = Blockly.Arduino.valueToCode(block, 'FROM', Blockly.Arduino.ORDER_NONE) || '0';
      const argument1 = Blockly.Arduino.valueToCode(block, 'TO', Blockly.Arduino.ORDER_NONE) || '0';
      return ['random(' + argument0 + ', ' + argument1 + ' + 1)', Blockly.Arduino.ORDER_ATOMIC];
    };

    Blockly.Arduino['text'] = function(block) {
      const code = Blockly.Arduino.quote_(block.getFieldValue('TEXT'));
      return [code, Blockly.Arduino.ORDER_ATOMIC];
    };

    Blockly.Arduino['logic_compare'] = function(block) {
      const OPERATORS = {
        'EQ': '==', 'NEQ': '!=', 'LT': '<', 'LTE': '<=', 'GT': '>', 'GTE': '>='
      };
      const operator = OPERATORS[block.getFieldValue('OP')];
      const argument0 = Blockly.Arduino.valueToCode(block, 'A', Blockly.Arduino.ORDER_RELATIONAL) || '0';
      const argument1 = Blockly.Arduino.valueToCode(block, 'B', Blockly.Arduino.ORDER_RELATIONAL) || '0';
      const code = argument0 + ' ' + operator + ' ' + argument1;
      return [code, Blockly.Arduino.ORDER_RELATIONAL];
    };

    Blockly.Arduino['logic_operation'] = function(block) {
      const operator = (block.getFieldValue('OP') == 'AND') ? '&&' : '||';
      const order = (operator == '&&') ? Blockly.Arduino.ORDER_LOGICAL_AND : Blockly.Arduino.ORDER_LOGICAL_OR;
      let argument0 = Blockly.Arduino.valueToCode(block, 'A', order);
      let argument1 = Blockly.Arduino.valueToCode(block, 'B', order);
      if (!argument0) argument0 = 'false';
      if (!argument1) argument1 = 'false';
      return [argument0 + ' ' + operator + ' ' + argument1, order];
    };

    Blockly.Arduino['logic_negate'] = function(block) {
      const argument0 = Blockly.Arduino.valueToCode(block, 'BOOL', Blockly.Arduino.ORDER_UNARY_PREFIX) || 'false';
      return ['!' + argument0, Blockly.Arduino.ORDER_UNARY_PREFIX];
    };

    Blockly.Arduino['logic_boolean'] = function(block) {
      const code = (block.getFieldValue('BOOL') == 'TRUE') ? 'true' : 'false';
      return [code, Blockly.Arduino.ORDER_ATOMIC];
    };

    Blockly.Arduino['controls_if'] = function(block) {
      let n = 0;
      let code = '';
      let branchCode, conditionCode;
      do {
        conditionCode = Blockly.Arduino.valueToCode(block, 'IF' + n, Blockly.Arduino.ORDER_NONE) || 'false';
        branchCode = Blockly.Arduino.statementToCode(block, 'DO' + n);
        code += (n > 0 ? ' else ' : '') + 'if (' + conditionCode + ') {\n' + branchCode + '}';
        n++;
      } while (block.getInput('IF' + n));

      if (block.getInput('ELSE')) {
        branchCode = Blockly.Arduino.statementToCode(block, 'ELSE');
        code += ' else {\n' + branchCode + '}';
      }
      return code + '\n';
    };

    Blockly.Arduino['controls_ifelse'] = Blockly.Arduino['controls_if'];

    Blockly.Arduino['controls_repeat_ext'] = function(block) {
      const repeats = Blockly.Arduino.valueToCode(block, 'TIMES', Blockly.Arduino.ORDER_ADDITIVE) || '0';
      let branch = Blockly.Arduino.statementToCode(block, 'DO');
      branch = Blockly.Arduino.addLoopTrap(branch, block);
      const loopVar = Blockly.Arduino.nameDB_.getDistinctName('count', Blockly.Variables.NAME_TYPE);
      return '  for (int ' + loopVar + ' = 0; ' + loopVar + ' < ' + repeats + '; ' + loopVar + '++) {\n' + branch + '  }\n';
    };

    Blockly.Arduino['controls_whileUntil'] = function(block) {
      const until = block.getFieldValue('MODE') == 'UNTIL';
      let argument0 = Blockly.Arduino.valueToCode(block, 'BOOL', Blockly.Arduino.ORDER_NONE) || 'false';
      if (until) argument0 = '!' + argument0;
      let branch = Blockly.Arduino.statementToCode(block, 'DO');
      branch = Blockly.Arduino.addLoopTrap(branch, block);
      return '  while (' + argument0 + ') {\n' + branch + '  }\n';
    };

    Blockly.Arduino['controls_for'] = function(block) {
      const variable0 = Blockly.Arduino.nameDB_.getName(block.getFieldValue('VAR'), Blockly.Variables.NAME_TYPE);
      const argument0 = Blockly.Arduino.valueToCode(block, 'FROM', Blockly.Arduino.ORDER_ASSIGNMENT) || '0';
      const argument1 = Blockly.Arduino.valueToCode(block, 'TO', Blockly.Arduino.ORDER_ASSIGNMENT) || '0';
      let branch = Blockly.Arduino.statementToCode(block, 'DO');
      branch = Blockly.Arduino.addLoopTrap(branch, block);
      return '  for (int ' + variable0 + ' = ' + argument0 + '; ' + variable0 + ' <= ' + argument1 + '; ' + variable0 + '++) {\n' + branch + '  }\n';
    };

    Blockly.Arduino['variables_get'] = function(block) {
      const code = Blockly.Arduino.nameDB_.getName(block.getFieldValue('VAR'), Blockly.Variables.NAME_TYPE);
      return [code, Blockly.Arduino.ORDER_ATOMIC];
    };

    Blockly.Arduino['variables_set'] = function(block) {
      const argument0 = Blockly.Arduino.valueToCode(block, 'VALUE', Blockly.Arduino.ORDER_ASSIGNMENT) || '0';
      const varName = Blockly.Arduino.nameDB_.getName(block.getFieldValue('VAR'), Blockly.Variables.NAME_TYPE);
      return '  ' + varName + ' = ' + argument0 + ';\n';
    };

    // ============================================
    // 6. FUNCIONES DE LA UI
    // ============================================
    function generarCodigo() {
      try {
        const code = Blockly.Arduino.workspaceToCode(workspace);
        document.getElementById('codeArea').value = code;
        showStatus('Código generado correctamente.', 'info');
        return code;
      } catch (e) {
        document.getElementById('codeArea').value = '❌ ERROR: ' + e.message;
        showStatus('Error al generar código. Revisa la consola (F12).', 'err');
        console.error(e);
        return null;
      }
    }

    function descargarCodigo() {
      const code = document.getElementById('codeArea').value;
      if (!code || code.startsWith('❌')) {
        showStatus('Primero genera el código.', 'err');
        return;
      }
      const blob = new Blob([code], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sketch_arduino.ino';
      a.click();
      showStatus('Archivo descargado.', 'ok');
    }

    async function subirAAduino() {
      const code = generarCodigo();
      if (!code) return;

      const btn = document.getElementById('btnSubir');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Subiendo...';
      showStatus('Conectando con el agente local...', 'info');

      try {
        const response = await fetch('http://localhost:5000/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        });

        const result = await response.json();

        if (result.success) {
          showStatus('✅ ' + result.message, 'ok');
        } else {
          showStatus('❌ ' + result.error, 'err');
        }
      } catch (err) {
        showStatus(
          '❌ No se pudo conectar con el agente local.\n' +
          'Asegúrate de ejecutar: python agente_local.py',
          'err'
        );
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('statusArea');
      el.textContent = msg;
      el.className = '';
      if (type === 'ok') el.classList.add('status-ok');
      else if (type === 'err') el.classList.add('status-err');
      else el.classList.add('status-info');
    }
  </script>
</body>
</html>
